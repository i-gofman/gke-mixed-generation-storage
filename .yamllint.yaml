extends: default

ignore: |
  charts/*/templates/
  # Go templates rendered by krew, not YAML until it is processed.
  .krew.yaml

rules:
  line-length:
    max: 120
    level: warning
  comments:
    min-spaces-from-content: 1
  truthy:
    # GitHub Actions uses `on:` as a key.
    allowed-values: ["true", "false"]
    check-keys: false
  document-start: disable
  braces:
    max-spaces-inside: 1
