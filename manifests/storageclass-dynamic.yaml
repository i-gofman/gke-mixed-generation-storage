# A StorageClass that survives a mixed N2/N4 fleet.
#
# type: dynamic asks GKE to pick the disk type at provisioning time based on
# the node the Pod is scheduled to. Requires control plane 1.35.3-gke.1290000+.
#
# Two parameters matter more than the rest:
#
#   disk-type-preference      What to use on a node that supports BOTH
#                             families. GKE defaults to hyperdisk-type, and on
#                             an N2/N4 fleet that default is the wrong one: N2
#                             appears in the Hyperdisk Balanced support matrix,
#                             so GKE treats it as "supports both" - but
#                             Hyperdisk Balanced on previous-generation
#                             machines (N2, C2, ...) is allowlisted, and your
#                             project may not be able to provision it at all.
#                             pd-type encodes what people assume they are
#                             getting: Hyperdisk on N4, Persistent Disk on N2.
#
#   use-allowed-disk-topology Disk type selection runs ONCE, at provisioning.
#                             Without this, nothing stops the scheduler from
#                             later moving the Pod to a node that cannot attach
#                             the type already provisioned. Requires the
#                             cluster AND every node pool at
#                             1.34.1-gke.2541000+.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mixed-generation-safe
provisioner: pd.csi.storage.gke.io
parameters:
  type: dynamic
  disk-type-preference: pd-type
  pd-type: pd-balanced
  hyperdisk-type: hyperdisk-balanced
  use-allowed-disk-topology: "true"
  # Hyperdisk-only parameters, ignored when the Persistent Disk branch is
  # chosen. 3,000 IOPS and 140 MiB/s per volume are the free Hyperdisk Balanced
  # baseline; anything above bills per volume for the life of the volume, which
  # on an autoscaling workload multiplies by the replica count. Uncomment only
  # if you need more, and check the machine type's own limits first.
  # provisioned-iops-on-create: "3000"
  # provisioned-throughput-on-create: "140Mi"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
