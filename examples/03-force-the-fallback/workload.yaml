# A workload that opts into the ComputeClass and uses a generic ephemeral
# volume, so it is actually portable across the fallback. Swap the volume for
# a bound PVC and this example turns into example 01.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fallback-demo
  labels:
    app: fallback-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fallback-demo
  template:
    metadata:
      labels:
        app: fallback-demo
    spec:
      nodeSelector:
        cloud.google.com/compute-class: n4-preferred
      containers:
        - name: app
          image: registry.k8s.io/busybox:1.27.2
          command: ["sh", "-c", "while true; do date >> /scratch/heartbeat; sleep 30; done"]
          volumeMounts:
            - name: scratch
              mountPath: /scratch
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: scratch
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                storageClassName: mixed-generation-safe
                resources:
                  requests:
                    storage: 50Gi
